services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soat-manager-backend
    ports:
      - "3001:3001"
    volumes:
      - soat-pdfs:/app/pdfs
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soat-manager-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  soat-pdfs:
    driver: local
