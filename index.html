        new Chart(document.getElementById('cS'),{type:'line',data:{labels:d.ventasSemanales.map(function(v){return v.label;}),datasets:[{data:d.ventasSemanales.map(function(v){return v.monto;}),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,0.1)',fill:true,tension:0.3,pointRadius:6}]},options:{responsive:true,plugins:{legend:{display:false},datalabels:{anchor:'end',align:'top',color:'#1e40af',font:{size:9,weight:'bold'},formatter:function(v){return '$'+(v/1000000).toFixed(1)+'M';}}},scales:{y:{ticks:{callback:function(v){return '$'+(v/1000000).toFixed(1)+'M';}}}}}});

        // Diario cantidad
        new Chart(document.getElementById('cDC'),{type:'bar',data:{labels:d.ventasDiarias.map(function(v){var p=v.dia.split('-');return p[0]+'/'+p[1];}),datasets:[{data:d.ventasDiarias.map(function(v){return v.txns;}),backgroundColor:'#06b6d4',borderRadius:4}]},options:{responsive:true,plugins:{legend:{display:false},datalabels:{anchor:'end',align:'top',color:'#475569',font:{size:11,weight:'bold'}}},scales:{x:{ticks:{maxRotation:60,minRotation:45}},y:{ticks:{stepSize:1}}}}});

        // Semanal cantidad
        new Chart(document.getElementById('cSC'),{type:'line',data:{labels:d.ventasSemanales.map(function(v){return v.label;}),datasets:[{data:d.ventasSemanales.map(function(v){return v.txns;}),borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.1)',fill:true,tension:0.3,pointRadius:6}]},options:{responsive:true,plugins:{legend:{display:false},datalabels:{anchor:'end',align:'top',color:'#92400e',font:{size:9,weight:'bold'}}},scales:{y:{ticks:{stepSize:1}}}}});

        // Todos estados apilada
        new Chart(document.getElementById('cDT'),{type:'bar',data:{labels:d.txnDiariasTodas.map(function(v){var p=v.dia.split('-');return p[0]+'/'+p[1];}),datasets:[{label:'Aprobadas',data:d.txnDiariasTodas.map(function(v){return v.APROBADO;}),backgroundColor:'#059669',borderRadius:3},{label:'Rechazadas',data:d.txnDiariasTodas.map(function(v){return v.RECHAZADO;}),backgroundColor:'#dc2626',borderRadius:3},{label:'Expiradas',data:d.txnDiariasTodas.map(function(v){return v.EXPIRADA;}),backgroundColor:'#f59e0b',borderRadius:3},{label:'Intentadas',data:d.txnDiariasTodas.map(function(v){return v.INTENTADO;}),backgroundColor:'#94a3b8',borderRadius:3}]},options:{responsive:true,plugins:{legend:{position:'top'},datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:'center',align:'center',color:'#fff',font:{size:10,weight:'bold'}}},scales:{x:{stacked:true,ticks:{maxRotation:60,minRotation:45}},y:{stacked:true,beginAtZero:true,ticks:{stepSize:1}}}}});

        // Comparativo mensual
        if(d.ventasMensuales.length>1){
            var mn=d.ventasMensuales.map(function(v){return v.nombre.charAt(0).toUpperCase()+v.nombre.slice(1);});
            var cl=['#6366f1','#06b6d4','#10b981','#f59e0b','#ef4444','#8b5cf6'];
            new Chart(document.getElementById('cMC'),{type:'bar',data:{labels:mn,datasets:[{data:d.ventasMensuales.map(function(v){return v.txns;}),backgroundColor:d.ventasMensuales.map(function(_,i){return cl[i%cl.length];}),borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false},datalabels:{anchor:'end',align:'top',font:{size:12,weight:'bold'}}},scales:{y:{beginAtZero:true,ticks:{stepSize:5}}}}});
            new Chart(document.getElementById('cMM'),{type:'bar',data:{labels:mn,datasets:[{data:d.ventasMensuales.map(function(v){return v.monto;}),backgroundColor:d.ventasMensuales.map(function(_,i){return cl[i%cl.length];}),borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false},datalabels:{anchor:'end',align:'top',font:{size:12,weight:'bold'},formatter:function(v){return '$'+(v/1000000).toFixed(1)+'M';}}},scales:{y:{beginAtZero:true,ticks:{callback:function(v){return '$'+(v/1000000).toFixed(1)+'M';}}}}}});
        }

        // Metodo de pago
        var mpK=Object.keys(d.metodos);
        new Chart(document.getElementById('cMP'),{type:'bar',data:{labels:mpK,datasets:[{data:mpK.map(function(k){return d.metodos[k].monto;}),backgroundColor:['#3b82f6','#a855f7','#f59e0b','#10b981'],borderRadius:6,barThickness:50}]},options:{responsive:true,plugins:{legend:{display:false},datalabels:{anchor:'end',align:'top',font:{size:11,weight:'bold'},formatter:function(v){return '$'+(v/1000000).toFixed(1)+'M';}}},scales:{y:{ticks:{callback:function(v){return '$'+(v/1000000).toFixed(0)+'M';}}}}}});

        // Rechazos
        var mk=Object.keys(d.motivos).sort(function(a,b){return d.motivos[b]-d.motivos[a];});
        var mv=mk.map(function(k){return d.motivos[k];});
        var mc=['#ef4444','#f97316','#eab308','#6366f1','#14b8a6','#ec4899','#8b5cf6'];
        new Chart(document.getElementById('cR'),{type:'bar',data:{labels:mk.map(function(k){return k.length>30?k.substring(0,30)+'...':k;}),datasets:[{data:mv,backgroundColor:mk.map(function(_,i){return mc[i%mc.length];}),borderRadius:4}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},datalabels:{anchor:'end',align:'end',font:{size:11,weight:'bold'}}},scales:{x:{ticks:{stepSize:1}},y:{ticks:{font:{size:11}}}}}});
    },100);
})();

function dlXls(type){
    var rows,fn;
    if(type==='si'){
        fn='ventas-exitosas-soat.xlsx';
        rows=DATA.exitosas.map(function(r,i){return{'#':i+1,'Fecha':r.fecha,'Fase':r.fase==='AF'?'Amigos y Familia':'Marcha Blanca','Placa':r.placa,'Nombre':r.nombre,'Celular':r.telefono,'Correo':r.email,'Metodo':r.metodoPago,'Banco':r.banco,'Monto':r.monto};});
    }else{
        fn='no-exitosas-soat.xlsx';
        rows=DATA.noExitosas.map(function(r,i){return{'#':i+1,'Fecha':r.fecha,'Placa':r.placa,'Nombre':r.nombre,'Celular':r.telefono,'Correo':r.email,'Metodo':r.metodoPago,'Monto':r.monto,'Estado':r.estado,'Motivo':r.detalleEstado};});
    }
    var ws=XLSX.utils.json_to_sheet(rows);
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Datos');
    XLSX.writeFile(wb,fn);
}
</script>
